version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    ignore:
      # A new major of a peer means widening the peer range on purpose, not a routine bump.
      - dependency-name: vue
        update-types: ['version-update:semver-major']
      - dependency-name: markdown-it
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/markdown-it'
        update-types: ['version-update:semver-major']
      # Kept on the lowest supported Node, so newer Node APIs fail the typecheck.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Vitest majors usually come with breaking config/API changes, so they're upgraded by hand.
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']
